[project]
authors = [{name = "Jennings Zhang", email = "jennings.zhang@childrens.harvard.edu"}]
dependencies = ["chris-plugin==0.4.0", "loguru>=0.7.3,<0.8"]
name = "pl-dcm2niix"
requires-python = ">= 3.11"
version = "0.0.0+unknown"

[project.scripts]
dcm2niixw = "dcm2niixw:main"

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[tool.hatch.build.targets.wheel]
packages = ["dcm2niixw.py"]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64", "linux-aarch64", "linux-ppc64le"]

[tool.pixi.pypi-dependencies]
pl_dcm2niix = { path = ".", editable = true }

[tool.pixi.tasks]
build = "hatch build -t wheel"

[tool.pixi.dependencies]
dcm2niix = ">=1.0.20250506,<2"
dcmtk = ">=3.7.0,<4"

[tool.pixi.feature.build.dependencies]
hatch = "*"

[tool.pixi.feature.prod.dependencies]
pip = "*"

[tool.pixi.environments]
build = { features = ["build"], solve-group = "default" }
prod = { features = ["prod"], solve-group = "default" }

